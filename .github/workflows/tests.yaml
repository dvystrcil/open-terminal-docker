name: tests

# 12 unit tests live in tests/ and NOTHING ran them.
#
# Measured 2026-09-12 across the account: seven repos had test files that no
# PR check executed. All 12 here pass hermetically — no network, no
# container, no live service — so this is not a backlog of broken tests. It
# is a suite that was written and never consulted.
#
# A test suite nothing executes is not coverage. It is a file.

on:
  pull_request:
    paths:
      - 'tests/**'
      # The baseline holds the floors this gate enforces. Without it
      # here, a PR that LOWERS a floor does not trigger the check that
      # would validate the new one — the one file whose entire purpose
      # is to be checked, exempt from checking.
      - '.coverage-baseline.json'
      - '.github/workflows/tests.yaml'
  push:
    branches: [main]
    paths:
      - 'tests/**'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install pytest
        run: python3 -m pip install --quiet pytest

      - name: Unit tests
        run: python3 -m pytest tests/ -q --strict-markers

      # pytest exits 5 and prints "no tests ran" when it collects nothing,
      # which reads as success in some invocations. Assert the count so this
      # check cannot go green having executed nothing — the exact failure it
      # was added to end.
      # Parse pytest's SUMMARY line ("12 tests collected in 0.01s"), not the
      # per-test node-id lines. The node-id format is version-dependent --
      # `--collect-only` without `-q` prints `<Module ...>` instead -- so a
      # format change would have silently counted zero and failed a healthy
      # suite. Flagged in review on dvystrcil/open-terminal-docker#76.
      #
      # A count that cannot be READ is not a count of zero. The earlier
      # version ended in `|| true`, which turned a parse miss into 0 and a
      # hard failure; that is the same "absent must not read as zero" rule
      # dvystrcil/coverage-action enforces, broken here by its own author.
      # Now an unreadable count fails with its own distinct message.
      #
      # The threshold is still worth having even though pytest already exits
      # 5 on ZERO collection (so the run step above fails on its own). Exit 5
      # cannot see a PARTIAL collapse -- a broken conftest or a renamed
      # directory that collects 3 of 12 exits 0 and passes.
      - name: Assert the suite actually ran
        run: |
          set -euo pipefail
          summary=$(python3 -m pytest tests/ -q --collect-only 2>/dev/null | tail -5)
          count=$(printf '%s\n' "$summary" \
                  | sed -n 's/^\([0-9][0-9]*\) tests\? collected.*/\1/p' | tail -1)
          if [ -z "$count" ]; then
            echo "::error::could not read a collection count from pytest output. That is not zero tests -- it means this assertion could not be evaluated, so it fails rather than guessing."
            printf '%s\n' "$summary"
            exit 1
          fi
          echo "collected $count test(s)"
          if [ "$count" -lt 6 ]; then
            echo "::error::collected only $count tests; 12 were present when this check was written. Either the suite shrank sharply or collection is broken."
            exit 1
          fi

  # Coverage is gated separately from the suite above: that one says the
  # assertions hold, this says they were REACHED and that the suite ran at
  # all. Floors live in .coverage-baseline.json so lowering one is a
  # reviewable diff rather than a quiet edit to a number in workflow YAML.
  #
  # A green run here is evidence the harness ran, not that the code is
  # correct. Coverage says a line executed, not that anything would notice if
  # it were wrong -- on dvystrcil/n8n-workflow at 99.90% line coverage, five
  # real mutations survived.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python3 -m pip --version >/dev/null 2>&1 || {
            echo "::error::python3 -m pip is unavailable — an environment problem, not a PyPI one."
            exit 1
          }
          for attempt in 1 2 3; do
            python3 -m pip install --quiet coverage pytest && exit 0
            echo "::warning::pip install failed (attempt ${attempt}/3) — retrying"
            sleep $((attempt * 10))
          done
          echo "::error::pip install failed three times"
          exit 1
      - uses: dvystrcil/coverage-action@v1
        with:
          runtime: python
          test_command: >-
            python3 -m coverage run --branch --source=helpers -m pytest tests/ -q
