name: Release

on:
  release:
    types: [published]

env:
  INTERNAL_REGISTRY: harbor-core.harbor.svc.cluster.local
  PROJECT: open-terminal
  IMAGE_NAME: open-terminal

jobs:
  promote:
    runs-on: open-terminal-docker-runner
    permissions:
      contents: write
      id-token: write

    steps:
      # Resolve the exact commit this release's tag points to. Do NOT
      # trust dev-amd64/dev-arm64 (floating tags docker.yml's build job
      # overwrites on every push) to still reflect this commit by the
      # time this job runs -- a later commit's build can race ahead and
      # overwrite them first, silently promoting the WRONG code under
      # this release's version tag. See homelab#822.
      - name: Resolve release commit SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Record resolved SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Log in to Harbor (internal)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.INTERNAL_REGISTRY }}
          username: ${{ env.HB_USERNAME }}
          password: ${{ env.HB_PASSWORD }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          buildkitd-config-inline: |
            [registry."harbor-core.harbor.svc.cluster.local"]
              ca=["/etc/ssl/certs/ca-certificates.crt"]

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Retag the exact commit's sha-<sha>-{amd64,arm64} images -> semver +
      # latest -- no rebuild. Pinned to steps.sha.outputs.sha (the release
      # tag's actual commit), NOT the floating dev-amd64/dev-arm64 tags,
      # which a later commit's build job may have already overwritten by
      # the time this job runs.
      - name: Promote release commit's images to release tags
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
          RELEASE_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          for TAG in $(jq -cr '[.tags[]] | unique | .[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            docker manifest create "$TAG" \
              ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:sha-${RELEASE_SHA}-amd64 \
              ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:sha-${RELEASE_SHA}-arm64
            docker manifest push "$TAG"
          done

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Generate AI release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          API="https://api.github.com/repos/${REPO}"
          AUTH="Authorization: Bearer $GITHUB_TOKEN"

          PREV_TAG=$(curl -sf -H "$AUTH" "${API}/releases" \
            | jq -r "[.[] | select(.tag_name != \"$TAG\")] | .[0].tag_name // empty")

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(curl -sf -H "$AUTH" "${API}/compare/${PREV_TAG}...${TAG}" \
              | jq -r '[.commits[] | .commit.message | split("\n")[0]] | join("\n")')
          else
            COMMITS="Initial release"
          fi

          PROMPT="Write release notes for open-terminal ${TAG}, a self-hosted web terminal Docker image. Based on these commits since ${PREV_TAG}:\n\n${COMMITS}\n\nUse markdown with brief sections (What's Changed, etc.). Be concise and user-focused. Do not include preamble or sign-off."

          NOTES=$(curl -sf --max-time 120 \
            http://ollama.ollama.svc.cluster.local/api/generate \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg model "gemma4:31b" --arg prompt "$PROMPT" \
              '{model: $model, prompt: $prompt, stream: false}')" \
            | jq -r .response)

          if [ -n "$NOTES" ]; then
            RELEASE_ID=$(curl -sf -H "$AUTH" "${API}/releases/tags/${TAG}" | jq -r .id)
            curl -sf -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
              "${API}/releases/${RELEASE_ID}" \
              -d "$(jq -n --arg body "$NOTES" '{body: $body}')"
          fi

  # homelab#2320: merge = release = deploy. After promote (the tag must exist
  # in Harbor), release-action's deploy step moves the newTag of
  # harbor.sirddail.net/open-terminal/open-terminal in dvystrcil/open-terminal: newTag lines only, every
  # kustomize root rendered before/after (image-only diff), never a
  # downgrade, a major goes to a PR, retried if main moves.
  #
  # Kill switch: repo variable AUTO_DEPLOY. `false` opens one PR
  # (deploy/open-terminal-<ver>) instead of committing; committing to main needs the
  # CICD App as a bypass actor on open-terminal's ruleset.
  deploy:
    needs: promote
    runs-on: open-terminal-docker-runner
    permissions:
      contents: read
      id-token: write
    # One deploy at a time; a pending newer release replaces an older pending
    # one. An older release that loses a race finds main past it (noop).
    concurrency:
      group: deploy-dvystrcil/open-terminal
      cancel-in-progress: false
    steps:
      # One named secret per step, never the whole store.
      - name: Fetch CICD_APP_CLIENT_ID from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: CICD_APP_CLIENT_ID
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Fetch CICD_APP_PRIVATE_KEY from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: CICD_APP_PRIVATE_KEY
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Generate app token
        # The CICD GitHub App, scoped to the repo it writes.
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        id: app-token
        with:
          client-id: ${{ env.CICD_APP_CLIENT_ID }}
          private-key: ${{ env.CICD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: open-terminal

      - name: Deploy to open-terminal
        id: deploy
        uses: dvystrcil/release-action@v1
        with:
          token: ${{ steps.app-token.outputs.token }}
          create-release: false
          version: ${{ github.event.release.tag_name }}
          deploy-repo: dvystrcil/open-terminal
          deploy-images: harbor.sirddail.net/open-terminal/open-terminal
          auto-deploy: ${{ vars.AUTO_DEPLOY }}

      - run: echo "deploy-result=${{ steps.deploy.outputs.deploy-result }}"
