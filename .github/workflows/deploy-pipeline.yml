name: Deploy Pipeline to OWUI

on:
  push:
    branches: [main]
    paths:
      - 'helpers/git_sync_filter.py'
  workflow_dispatch:
    inputs:
      pipeline_path:
        description: 'Pipeline file (relative to repo root)'
        required: false
        default: 'helpers/git_sync_filter.py'

env:
  PIPELINE_PATH: ${{ github.event.inputs.pipeline_path || 'helpers/git_sync_filter.py' }}

jobs:
  deploy:
    runs-on: open-terminal-docker-runner
    permissions:
      contents: read

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Mint cross-repo token via CICD App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.CICD_APP_CLIENT_ID }}
          private-key: ${{ env.CICD_APP_PRIVATE_KEY }}
          repositories: homelab
          owner: dvystrcil

      - name: Checkout homelab (for owui-import-pipeline.sh)
        uses: actions/checkout@v6
        with:
          repository: dvystrcil/homelab
          path: homelab
          sparse-checkout: bin
          sparse-checkout-cone-mode: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig from Infisical-injected SA token
        run: |
          set -euo pipefail
          test -n "${PIPELINE_DEPLOYER_TOKEN:-}" || {
            echo "::error::PIPELINE_DEPLOYER_TOKEN not set in Infisical (project homelab-bz-gt path /open-terminal-docker env prod)"
            exit 1
          }
          mkdir -p ~/.kube
          cat > ~/.kube/config <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - name: in-cluster
            cluster:
              server: https://kubernetes.default.svc
              insecure-skip-tls-verify: true
          contexts:
          - name: deployer
            context:
              cluster: in-cluster
              user: deployer
              namespace: open-webui
          current-context: deployer
          users:
          - name: deployer
            user:
              token: ${PIPELINE_DEPLOYER_TOKEN}
          EOF
          chmod 600 ~/.kube/config
          kubectl --namespace=open-webui auth can-i get pods

      - name: Import pipeline
        run: |
          set -uo pipefail
          chmod +x homelab/bin/owui-import-pipeline.sh
          homelab/bin/owui-import-pipeline.sh "$PIPELINE_PATH"
          rc=$?
          # The script's step 3 spawns a kubectl-run probe pod that curls
          # the pipelines HTTP API. From inside the cluster the probe-pod
          # image pull + scheduling regularly exceeds curl --max-time 30,
          # producing exit 28 *after* step 2 (kubectl cp) has already
          # landed the file. The Verify step below is the real source of
          # truth for "did the reload happen?", so a step-3 timeout is a
          # warning, not a failure. Tracked: TODO file homelab issue.
          if [ "$rc" -eq 28 ]; then
            echo "::warning::Import script exited 28 (probe-pod timeout). File copy completed; Verify step is authoritative."
          elif [ "$rc" -ne 0 ]; then
            echo "::error::Import script failed with exit code $rc"
            exit "$rc"
          fi

      - name: Verify v1.2 startup banner
        run: |
          set -euo pipefail
          # Allow up to ~60s for the reload to land
          for i in $(seq 1 12); do
            if kubectl -n open-webui logs deploy/owui-pipelines --tail=400 \
                | grep -q "Git Sync Filter starting up"; then
              echo "::notice::Sync filter startup banner observed"
              kubectl -n open-webui logs deploy/owui-pipelines --tail=400 \
                | grep "\[sync\]" | tail -10
              exit 0
            fi
            sleep 5
          done
          echo "::error::Did not observe sync filter startup banner within 60s"
          kubectl -n open-webui logs deploy/owui-pipelines --tail=200 | tail -60
          exit 1
