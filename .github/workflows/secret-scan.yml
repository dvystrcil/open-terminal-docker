name: secret-scan
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: open-terminal-docker-runner
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history for PR diff scans
      - uses: gitleaks/gitleaks-action@v2.3.7  # pin the tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
