name: Watch Upstream Base Image
on:
  schedule:
    - cron: '0 1 * * *'   # daily at 1am
  workflow_dispatch:

env:
  UPSTREAM_IMAGE: ghcr.io/open-webui/open-terminal:latest

jobs:
  mirror:
    runs-on: open-terminal-docker-runner
    permissions:
      contents: read
      actions: write

    steps:
      # Restore the digest this job saw last time. The cache is the state
      # store on purpose: the previous version compared upstream against the
      # copy in Harbor's ghcr-proxy project, which cannot work -- reading a
      # proxy-cache path triggers a pull-through, so it always ends up equal
      # to upstream and the comparison can never report a change.
      - name: Restore last-seen upstream digest
        id: digest-cache
        uses: actions/cache@v6
        with:
          path: .upstream-digest
          key: upstream-digest-${{ env.UPSTREAM_IMAGE }}-${{ github.run_id }}
          restore-keys: |
            upstream-digest-${{ env.UPSTREAM_IMAGE }}-

      - name: Check whether upstream moved
        id: mirror
        run: |
          set -euo pipefail

          UPSTREAM_DIGEST=$(docker buildx imagetools inspect \
            "${UPSTREAM_IMAGE}" --format '{{json .Manifest.Digest}}')
          echo "Upstream digest: ${UPSTREAM_DIGEST}"

          PREVIOUS_DIGEST=$(cat .upstream-digest 2>/dev/null || echo "none")
          echo "Previously seen:  ${PREVIOUS_DIGEST}"

          # No mirroring step. Harbor's ghcr-proxy is a PROXY CACHE: it pulls
          # from ghcr.io on demand, and rejects pushes outright
          #   denied: can not push artifact to a proxy project: ghcr-proxy
          # So the old `docker pull && tag && push` could only ever fail, and
          # only did so on the days upstream actually moved -- which is why it
          # looked green for weeks. See homelab#1180.
          if [ "$UPSTREAM_DIGEST" != "$PREVIOUS_DIGEST" ]; then
            echo "Upstream moved — will trigger a rebuild"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          printf '%s' "${UPSTREAM_DIGEST}" > .upstream-digest

      - name: Trigger Docker build
        if: steps.mirror.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/docker.yml/dispatches" \
            -d '{"ref":"main"}'
