name: PR Agent

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: open-terminal-docker-runner
    name: Run PR Agent on PRs and comments
    steps:
      - name: PR Agent action
        uses: qodo-ai/pr-agent@4ae117c4af71ec92e361f8dee1124439f8a7b4a3 # main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG.MODEL: "ollama/qwen3.6:35b"
          CONFIG.MODEL_WEAK: "ollama/qwen3.6:35b"
          CONFIG.FALLBACK_MODELS: '["ollama/qwen3.6:35b"]'
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "32768"
          # litellm default is 120s; the larger `improve` (code-suggestions)
          # call on the local 35b — especially cold — exceeds it and posts
          # "Failed to generate code suggestions" (review/describe are smaller
          # and finish in time). 300s covers a cold-load + long generation.
          CONFIG.AI_TIMEOUT: "300"
          CONFIG.DUPLICATE_PROMPT_EXAMPLES: "true"
          OLLAMA.API_BASE: "http://ollama.ollama.svc.cluster.local"
          PR_REVIEWER.REQUIRE_TESTS_REVIEW: "false"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "true"
