name: PR Agent

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: open-terminal-docker-runner
    name: Run PR Agent on PRs and comments
    steps:
      - name: PR Agent action
        uses: qodo-ai/pr-agent@dec3e88c029c0a32957bd95aa694cb34d2b256e0 # main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG.MODEL: "ollama/qwen3.6:35b"
          CONFIG.MODEL_WEAK: "ollama/qwen3.6:35b"
          # Fallback must be a DIFFERENT, faster model: falling back to the
          # primary just repeats the same timeout (PR #97, 2026-11-17). It only
          # loads when the 35b fails, so the eviction cost that homelab#128
          # removed the dedicated model for stays rare. 14b met the review
          # quality bar on PR #20 (see #21).
          CONFIG.FALLBACK_MODELS: '["ollama/qwen2.5-coder:14b"]'
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "32768"
          # litellm default is 120s; the larger `improve` (code-suggestions)
          # call on the local 35b — especially cold — exceeds it and posts
          # "Failed to generate code suggestions" (review/describe are smaller
          # and finish in time). 300s covered a cold-load + long generation,
          # but the timeout also counts time queued behind other clients on
          # the shared single-slot ollama: PR #97's `improve` timed out 4x at
          # 300s. 900s absorbs that queue.
          CONFIG.AI_TIMEOUT: "900"
          CONFIG.DUPLICATE_PROMPT_EXAMPLES: "true"
          OLLAMA.API_BASE: "http://ollama.ollama.svc.cluster.local"
          PR_REVIEWER.REQUIRE_TESTS_REVIEW: "false"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "true"
